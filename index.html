<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Up Game</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#090914;
color:white
}

.container{
max-width:520px;
margin:auto;
padding:20px
}

h1{
text-align:center;
color:#00e5ff;
margin-bottom:5px
}

.subtitle{
text-align:center;
color:#aaa;
margin-bottom:20px
}

.card{
background:#151525;
padding:20px;
border-radius:16px;
box-shadow:0 0 20px #000
}

label{
display:block;
margin-top:15px;
margin-bottom:7px;
font-weight:bold
}

select,input{
width:100%;
padding:13px;
border:1px solid #333;
border-radius:9px;
background:#222238;
color:white;
font-size:15px
}

.nominal{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px
}

.nominal button{
padding:14px 8px;
border:1px solid #333;
border-radius:10px;
background:#202038;
color:white;
font-weight:bold;
cursor:pointer
}

.nominal button:hover,
.nominal button.pilih{
background:#00a8bd;
border-color:#00e5ff
}

.info{
margin-top:18px;
padding:14px;
background:#202038;
border-radius:10px;
line-height:1.8
}

.order{
color:#00e5ff;
font-weight:bold
}

#pesan{
width:100%;
margin-top:20px;
padding:15px;
border:0;
border-radius:10px;
background:#25d366;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer
}

#pesan:hover{
background:#1ebe5d
}
</style>
</head>

<body>

<div class="container">

<h1>🎮 TOP UP GAME</h1>
<div class="subtitle">Cepat • Mudah • Aman</div>

<div class="card">

<label>🎮 Pilih Game</label>

<select id="game" onchange="ubahNominal()">
<option value="Mobile Legends">Mobile Legends</option>
<option value="Free Fire">Free Fire</option>
<option value="PUBG Mobile">PUBG Mobile</option>
<option value="Honor of Kings">Honor of Kings</option>
</select>

<label>🆔 ID Player</label>
<input id="playerId" type="text" placeholder="Masukkan ID Player">

<label>🌐 Server / Zone ID</label>
<input id="serverId" type="text" placeholder="Masukkan Server / Zone ID">

<label>💎 Pilih Nominal</label>

<div class="nominal" id="nominalBox"></div>

<div class="info">

🧾 Nomor Order:
<span class="order" id="orderText">Akan dibuat saat pesan</span>

<br>

💎 Nominal:
<b id="nominalText">Belum dipilih</b>

<br>

💰 Harga:
<b id="hargaText">-</b>

</div>

<button id="pesan" onclick="pesanWhatsApp()">
📲 PESAN VIA WHATSAPP
</button>

</div>
</div>

<script>

let nominalDipilih="";
let hargaDipilih="";

const dataGame={

"Mobile Legends":[
["86 DM","20000"],
["172 DM","40000"],
["257 DM","60000"],
["344 DM","80000"],
["429 DM","100000"],
["514 DM","120000"],
["706 DM","160000"],
["878 DM","200000"]
],

"Free Fire":[
["70 DM","10000"],
["140 DM","20000"],
["355 DM","50000"],
["720 DM","100000"],
["1450 DM","200000"],
["2180 DM","300000"]
],

"PUBG Mobile":[
["60 UC","15000"],
["325 UC","75000"],
["660 UC","150000"],
["1800 UC","350000"],
["3850 UC","700000"]
],

"Honor of Kings":[
["80 Tokens","15000"],
["240 Tokens","40000"],
["400 Tokens","65000"],
["800 Tokens","120000"],
["1200 Tokens","175000"],
["2000 Tokens","280000"]
]

};

function ubahNominal(){

const game=document.getElementById("game").value;
const box=document.getElementById("nominalBox");

box.innerHTML="";

nominalDipilih="";
hargaDipilih="";

document.getElementById("nominalText").innerText="Belum dipilih";
document.getElementById("hargaText").innerText="-";

dataGame[game].forEach(item=>{

const button=document.createElement("button");

button.innerHTML=
item[0]+"<br>Rp"+
Number(item[1]).toLocaleString("id-ID");

button.onclick=function(){

document.querySelectorAll(".nominal button")
.forEach(btn=>btn.classList.remove("pilih"));

button.classList.add("pilih");

nominalDipilih=item[0];
hargaDipilih=item[1];

document.getElementById("nominalText").innerText=item[0];

document.getElementById("hargaText").innerText=
"Rp"+Number(item[1]).toLocaleString("id-ID");

};

box.appendChild(button);

});

}

function buatOrderID(){

const angka=Math.floor(100000+Math.random()*900000);

return "ORDER-"+angka;

}

function pesanWhatsApp(){

const game=document.getElementById("game").value;
const playerId=document.getElementById("playerId").value.trim();
const serverId=document.getElementById("serverId").value.trim();

if(!playerId){
alert("Masukkan ID Player terlebih dahulu!");
return;
}

if(!serverId){
alert("Masukkan Server / Zone ID terlebih dahulu!");
return;
}

if(!nominalDipilih){
alert("Pilih nominal terlebih dahulu!");
return;
}

const orderID=buatOrderID();

document.getElementById("orderText").innerText=orderID;

const harga=
"Rp"+Number(hargaDipilih).toLocaleString("id-ID");

const pesan=
`Halo Admin 👋

Saya ingin melakukan top up.

🧾 Nomor Order: ${orderID}
🎮 Game: ${game}
🆔 ID Player: ${playerId}
🌐 Server/Zone: ${serverId}
💎 Nominal: ${nominalDipilih}
💰 Harga: ${harga}

Mohon info pembayaran dan proses top upnya.`;

const nomorAdmin="6287739759760";

const url=
"https://wa.me/"+
nomorAdmin+
"?text="+
encodeURIComponent(pesan);

window.open(url,"_blank");

}

ubahNominal();

</script>

</body>
</html>
