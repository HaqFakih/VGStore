<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Up Game</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b14;
  color: white;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 25px 18px;
}

h1 {
  text-align: center;
  color: #00e5ff;
}

.card {
  background: #151525;
  padding: 20px;
  border-radius: 15px;
  margin-top: 20px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 7px;
}

input, select {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 9px;
  background: #24243a;
  color: white;
  font-size: 15px;
}

.nominal {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.nominal button {
  padding: 14px;
  border: 1px solid #333;
  border-radius: 10px;
  background: #202038;
  color: white;
  cursor: pointer;
}

.nominal button:hover {
  background: #00a8bd;
}

.pilih {
  background: #00a8bd !important;
}

#pesan {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #25d366;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#pesan:hover {
  background: #1ebe5d;
}

.info {
  margin-top: 18px;
  padding: 12px;
  background: #202038;
  border-radius: 10px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎮 TOP UP GAME</h1>

<div class="card">

<label>Game</label>
<select id="game">
  <option value="Mobile Legends">Mobile Legends</option>
  <option value="Free Fire">Free Fire</option>
  <option value="PUBG Mobile">PUBG Mobile</option>
</select>

<label>ID Player</label>
<input type="text" id="playerId" placeholder="Masukkan ID Player">

<label>Server / Zone ID</label>
<input type="text" id="serverId" placeholder="Masukkan Server / Zone ID">

<label>Pilih Nominal</label>

<div class="nominal">

<button onclick="pilih(this, '86 DM', '20000')">
86 DM<br>Rp20.000
</button>

<button onclick="pilih(this, '172 DM', '40000')">
172 DM<br>Rp40.000
</button>

<button onclick="pilih(this, '257 DM', '60000')">
257 DM<br>Rp60.000
</button>

<button onclick="pilih(this, '344 DM', '80000')">
344 DM<br>Rp80.000
</button>

</div>

<div class="info">
Nominal: <b id="nominalText">Belum dipilih</b><br>
Harga: <b id="hargaText">-</b>
</div>

<button id="pesan" onclick="pesanWhatsApp()">
📲 PESAN VIA WHATSAPP
</button>

</div>
</div>

<script>

let nominalDipilih = "";
let hargaDipilih = "";

function pilih(button, nominal, harga) {

  document.querySelectorAll(".nominal button")
    .forEach(btn => btn.classList.remove("pilih"));

  button.classList.add("pilih");

  nominalDipilih = nominal;
  hargaDipilih = harga;

  document.getElementById("nominalText").innerText = nominal;

  document.getElementById("hargaText").innerText =
    "Rp" + Number(harga).toLocaleString("id-ID");
}

function pesanWhatsApp() {

  const game = document.getElementById("game").value;
  const playerId = document.getElementById("playerId").value.trim();
  const serverId = document.getElementById("serverId").value.trim();

  if (!playerId) {
    alert("Masukkan ID Player terlebih dahulu!");
    return;
  }

  if (!serverId) {
    alert("Masukkan Server / Zone ID terlebih dahulu!");
    return;
  }

  if (!nominalDipilih) {
    alert("Pilih nominal terlebih dahulu!");
    return;
  }

  const harga =
    "Rp" + Number(hargaDipilih).toLocaleString("id-ID");

  const pesan =
`Halo Admin 👋

Saya ingin melakukan top up.

🎮 Game: ${game}
🆔 ID Player: ${playerId}
🌐 Server/Zone: ${serverId}
💎 Nominal: ${nominalDipilih}
💰 Harga: ${harga}

Mohon info pembayaran dan proses top upnya.`;

  const nomorAdmin = "6287739759760";

  const url =
    "https://wa.me/" +
    nomorAdmin +
    "?text=" +
    encodeURIComponent(pesan);

  window.open(url, "_blank");
}

</script>

</body>
</html>
