<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VG STORE - Top Up Game</title><style>*{box-sizing:border-box}body{margin:0;background:#020817;color:#fff;font-family:Arial,sans-serif}header{padding:20px;text-align:center;background:#061a38;border-bottom:1px solid #168cff}.logo{font-size:30px;font-weight:900;color:#19e6ff}.sub,p,.note{color:#9fb1ce}main{max-width:900px;margin:auto;padding:20px}.hero{text-align:center;padding:25px 5px}.hero h1{font-size:34px}.games,.nominals,.pays{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.game,.nominal,.pay,.card{background:#07152c;border:1px solid #12396d;border-radius:14px}.game{padding:18px;text-align:center;cursor:pointer}.game.active,.nominal.active,.pay.active{border-color:#19e6ff}.icon{font-size:36px}.card{padding:18px;margin-top:20px}input{width:100%;padding:14px;margin:7px 0 12px;border-radius:10px;border:1px solid #31547e;background:#020817;color:#fff}.nominal,.pay{padding:13px;color:#fff;cursor:pointer}button.order{width:100%;margin-top:18px;padding:16px;border:0;border-radius:12px;background:#168cff;color:#fff;font-weight:bold;font-size:16px}</style></head><body><header><div class="logo">VG STORE</div><div class="sub">TOP UP GAME CEPAT & MUDAH</div></header><main><section class="hero"><h1>Top Up Game</h1><p>Pilih game dan kirim pesanan melalui WhatsApp.</p></section><h2>🎮 Pilih Game</h2><div class="games"><div class="game" onclick="game('Mobile Legends',this)"><div class="icon">⚔️</div><b>Mobile Legends</b></div><div class="game" onclick="game('Free Fire',this)"><div class="icon">🔥</div><b>Free Fire</b></div><div class="game" onclick="game('Free Fire MAX',this)"><div class="icon">🔥</div><b>Free Fire MAX</b></div><div class="game" onclick="game('PUBG Mobile',this)"><div class="icon">🔫</div><b>PUBG Mobile</b></div><div class="game" onclick="game('Honor of Kings',this)"><div class="icon">👑</div><b>Honor of Kings</b></div></div><div class="card" id="order"><h2>📝 Data Pesanan</h2><input id="g" readonly placeholder="Game"><input id="id" placeholder="ID Player"><input id="sv" placeholder="Server / Zone"><h3>💎 Nominal</h3><div class="nominals"><button class="nominal" onclick="nom('86 DM',this)">86 DM</button><button class="nominal" onclick="nom('172 DM',this)">172 DM</button><button class="nominal" onclick="nom('257 DM',this)">257 DM</button><button class="nominal" onclick="nom('344 DM',this)">344 DM</button><button class="nominal" onclick="nom('429 DM',this)">429 DM</button><button class="nominal" onclick="nom('514 DM',this)">514 DM</button></div><h3>💳 Pembayaran</h3><div class="pays"><button class="pay" onclick="pay('GoPay',this)">GoPay</button><button class="pay" onclick="pay('DANA',this)">DANA</button><button class="pay" onclick="pay('QRIS',this)">QRIS</button></div><button class="order" onclick="order()">PESAN VIA WHATSAPP</button><p class="note">Pembayaran dan proses top up dilakukan melalui admin.</p></div></main><script>let G='',N='',P='';const A='6287739759760';function game(v,e){G=v;g.value=v;document.querySelectorAll('.game').forEach(x=>x.classList.remove('active'));e.classList.add('active');order.scrollIntoView({behavior:'smooth'});setTimeout(()=>id.focus(),400)}function nom(v,e){N=v;document.querySelectorAll('.nominal').forEach(x=>x.classList.remove('active'));e.classList.add('active')}function pay(v,e){P=v;document.querySelectorAll('.pay').forEach(x=>x.classList.remove('active'));e.classList.add('active')}function order(){let I=id.value.trim(),S=sv.value.trim()||'-';if(!G||!I||!N||!P)return alert('Lengkapi game, ID, nominal, dan pembayaran.');let O='ORDER-'+Math.floor(100000+Math.random()*900000);let M=`Halo VG STORE, saya mau order top up.%0A%0AOrder ID: ${O}%0AGame: ${G}%0AID Player: ${I}%0AServer/Zone: ${S}%0ANominal: ${N}%0APembayaran: ${P}`;location.href='https://wa.me/'+A+'?text='+M}</script></body></html>
